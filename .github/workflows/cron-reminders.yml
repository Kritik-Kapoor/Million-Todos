name: Cron Reminders

on:
  schedule:
    # Run once every hour at minute 0 (UTC)
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-reminders
  cancel-in-progress: false

jobs:
  process-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger due reminder processing
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL secret is not set"
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set"
            exit 1
          fi

          API_BASE_URL="${API_BASE_URL%/}"

          echo "Calling ${API_BASE_URL}/cron/reminders"

          response="$(curl \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --request POST \
            --url "${API_BASE_URL}/cron/reminders" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Accept: application/json" \
            --write-out "\nHTTP_STATUS:%{http_code}" \
            --max-time 240)"

          http_status="$(echo "$response" | tail -n1 | cut -d: -f2)"
          body="$(echo "$response" | sed '$d')"

          echo "Response status: ${http_status}"
          echo "Response body: ${body}"

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            exit 1
          fi
